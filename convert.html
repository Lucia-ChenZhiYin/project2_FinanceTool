<!DOCTYPE html>
<html>
<head>
    <title>簡易匯率換算</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #e8f5e9; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h3>美金換算台幣 (1:32)</h3>
        <input type="number" id="usd" placeholder="輸入美金金額">
        <button onclick="convert()">點我換算</button>
        <h2 id="result">NT$ 0</h2>
    </div>

    <script>
        function convert() {
            let usd = document.getElementById('usd').value;
            let ntd = usd * 32;
            document.getElementById('result').innerText = 'NT$ ' + ntd;
        }
    </script>
</body>
</html>
